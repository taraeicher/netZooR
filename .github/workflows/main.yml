name: netZooR

env:
    GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
on:
  push:
    branches: 
        - master
        - devel
  pull_request:
    branches: 
        - master
        - devel

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: [4.4]

    steps:

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-pandoc@v2.11.3

      - name: Set up R ${{ matrix.r-version }} 
        uses: r-lib/actions/setup-r@v2.11.3
        with:
          r-version: ${{ matrix.r-version }}

      - name: install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2.11.3
        with:
          cache-version: 3
          extra-packages: |
             any::rcmdcheck
             any::covr
          needs: |
             website
             coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python packages on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas joblib
        shell: pwsh

      - name: Install Python packages on Unix/Mac
        if: runner.os != 'Windows'
        run: |
          pip install --upgrade pip
          pip install numpy scipy pandas joblib
        shell: bash

      - name: Set RETICULATE_PYTHON on Windows
        if: runner.os == 'Windows'
        run: |
          "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Set RETICULATE_PYTHON on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
        shell: bash

      - name: Check
        uses: r-lib/actions/check-r-package@v2.11.3
        with:
            args: 'c("--no-manual", "--ignore-vignettes")'
            build_args: 'c("--no-build-vignettes")'
            error-on: '"error"'

      - name: Report coverage
        run: |
            covr::codecov()
        shell: Rscript {0}
